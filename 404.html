<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Rust Cyber Server - 404</title>
    <style>
        body {
            background-color: #0a0a12;
            color: #ff0055;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
            border: 2px solid #ff0055;
            padding: 40px;
            background: rgba(255, 0, 85, 0.05);
            box-shadow: 0 0 20px #ff0055, inset 0 0 20px rgba(255, 0, 85, 0.2);
            border-radius: 10px;
        }
        .bot-face {
            font-size: 80px;
            margin-bottom: 20px;
            text-shadow: 0 0 15px #ff0055;
            animation: glitch 1s infinite alternate;
        }
        h1 {
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 10px 0;
            text-shadow: 0 0 10px #ff0055;
        }
        p {
            color: #8888a0;
            font-size: 16px;
        }
        .status {
            display: inline-block;
            padding: 5px 15px;
            background: #ff0055;
            color: #0a0a12;
            font-weight: bold;
            border-radius: 5px;
            margin-top: 15px;
            box-shadow: 0 0 10px #ff0055;
            text-decoration: none;
        }
        @keyframes glitch {
            0%, 90%, 100% { text-shadow: 0 0 15px #ff0055; transform: skew(0deg); }
            93% { text-shadow: none; color: #331111; transform: skew(5deg); }
            95% { transform: skew(-5deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="bot-face">[x_x]</div>
        <h1>Rust Server: ERROR 404</h1>
        <p>Запрашиваемый ресурс не найден в системе.</p>
        <p>Маршрут отсутствует или был удален.</p>
        <a href="/" class="status">RETURN TO MAIN</a>
    </div>
</body>
</html>
