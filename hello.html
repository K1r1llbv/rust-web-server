<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Rust Cyber Server</title>
    <style>
        body {
            background-color: #0a0a12;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
            border: 2px solid #ff0055;
            padding: 40px;
            background: rgba(255, 0, 85, 0.05);
            box-shadow: 0 0 20px #ff0055, inset 0 0 20px rgba(255, 0, 85, 0.2);
            border-radius: 10px;
        }
        .bot-face {
            font-size: 80px;
            margin-bottom: 20px;
            text-shadow: 0 0 15px #00ffcc;
            animation: blink 3s infinite alternate;
        }
        h1 {
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 10px 0;
            text-shadow: 0 0 10px #00ffcc;
        }
        p {
            color: #8888a0;
            font-size: 16px;
        }
        .status {
            display: inline-block;
            padding: 5px 15px;
            background: #00ffcc;
            color: #0a0a12;
            font-weight: bold;
            border-radius: 5px;
            margin-top: 15px;
            box-shadow: 0 0 10px #00ffcc;
        }
        @keyframes blink {
            0%, 90%, 100% { text-shadow: 0 0 15px #00ffcc; }
            95% { text-shadow: none; color: #113333; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="bot-face">[•_•]</div>
        <h1>Rust Server: Online</h1>
        <p>Диалог с браузером успешно установлен.</p>
        <p>Обмен данными совершен.</p>
        <div class="status">CRAFTED BY ME</div>
    </div>
</body>
</html>
